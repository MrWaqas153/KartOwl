providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "nss", "atk", "cups", "libdrm", "dbus", "libxkbcommon", "mesa", "libGL", "glib", "pango", "cairo", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb", "expat"]

[phases.install]
cmds = ["npm install", "npx playwright install chromium --with-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start:prod"

[variables]
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"
PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH = "/usr/bin/chromium"