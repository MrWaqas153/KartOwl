providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "chromium"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build", "echo 'Chromium path:' && which chromium || echo 'not found'", "ls /nix/store/ | grep chromium | head -3"]

[start]
cmd = "npm run start:prod"

[variables]
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"
